<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Leaderboard</title>
  <link rel="icon" type="image/webp" href="gem.webp">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#000;
color:white;
overflow-x:hidden;
}

/* FONDO: FRANJAS DIAGONALES + PUNTOS */

body::before,
body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

body::before{
background:linear-gradient(155deg,
transparent 14%,
rgba(255,255,255,0.035) 14%,rgba(255,255,255,0.035) 27%,
transparent 27%,transparent 31%,
rgba(106,64,217,0.28) 31%,rgba(106,64,217,0.28) 37%,
transparent 37%,transparent 63%,
rgba(255,255,255,0.03) 63%,rgba(255,255,255,0.03) 71%,
transparent 71%,transparent 76%,
rgba(106,64,217,0.22) 76%,rgba(106,64,217,0.22) 81%,
transparent 81%);
}

body::after{
background:radial-gradient(rgba(151,137,205,0.45) 1.2px,transparent 1.7px) 0 0/9px 9px;
-webkit-mask-image:linear-gradient(155deg,transparent 22%,#000 32%,transparent 44%,transparent 68%,#000 78%,transparent 88%);
mask-image:linear-gradient(155deg,transparent 22%,#000 32%,transparent 44%,transparent 68%,#000 78%,transparent 88%);
opacity:0.6;
}

/* HEADER */

header{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:22px 60px;
}

.logo{
justify-self:end;
margin-right:84px;
font-weight:800;
font-size:20px;
letter-spacing:-0.5px;
color:white;
text-decoration:none;
}

.logo span{
color:#f7a823;
}

.nav-pill{
display:flex;
align-items:center;
gap:4px;
padding:6px 10px;
border:1px solid rgba(247,168,35,0.18);
border-radius:18px;
background:rgba(10,10,12,0.6);
}

.nav-pill a{
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
border-radius:12px;
text-decoration:none;
color:#d4d4d8;
font-size:15px;
font-weight:700;
transition:.2s;
}

.nav-pill a i{
color:#f7a823;
font-size:14px;
}

.nav-pill a:hover{
color:white;
background:rgba(255,255,255,0.05);
}

.nav-pill .nav-clash{
color:#f7a823;
}

.nav-pill .nav-clash:hover{
color:#ffbd45;
}

.nav-pill .nav-clash img{
width:20px;
}

/* MAIN */

.container{
max-width:1180px;
margin:auto;
padding:70px 20px 100px;
}

/* HERO */

.hero{
text-align:center;
}

.hero-logo{
width:64px;
margin-bottom:10px;
filter:drop-shadow(0 0 18px rgba(106,64,217,0.6));
}

.hero h1{
font-size:120px;
font-weight:900;
line-height:0.9;
letter-spacing:-2px;
}

.hero h1 span{
display:block;
color:transparent;
-webkit-text-stroke:2px #9789cd;
}

/* STATS */

.stats{
display:flex;
justify-content:center;
margin:50px auto 0;
max-width:760px;
}

.stat{
flex:1;
padding:12px 4px;
}

.stat + .stat{
border-left:1px solid rgba(151,137,205,0.25);
}

.stat dt{
font-size:12px;
font-weight:700;
color:#9789cd;
margin-bottom:8px;
}

.stat dd{
font-size:24px;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.stat dd .gem{
width:20px;
}

/* BOTONES */

.actions{
display:flex;
justify-content:center;
gap:12px;
margin-top:38px;
}

.btn{
height:50px;
padding:0 20px;
border-radius:8px;
display:inline-flex;
align-items:center;
gap:10px;
font-family:inherit;
font-size:14.4px;
font-weight:800;
color:white;
text-decoration:none;
cursor:pointer;
transition:.2s;
}

.btn-play{
background:#6a40d9;
border:1px solid #6a40d9;
}

.btn-play:hover{
background:#7a52e6;
}

.btn-code{
background:rgba(106,64,217,0.22);
border:1px solid rgba(151,137,205,0.45);
font-weight:400;
color:#9789cd;
}

.btn-code b{
color:white;
font-weight:800;
}

.btn-code:hover{
background:rgba(106,64,217,0.32);
}

/* PODIO */

.podium{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
align-items:start;
max-width:1180px;
margin:90px auto 0;
}

.podium-player{
position:relative;
border-radius:14px;
overflow:hidden;
text-align:center;
color:var(--ink);
text-shadow:0 1px 0 var(--hl);
box-shadow:
inset 0 1px 0 rgba(255,255,255,0.6),
inset 0 -22px 32px -24px rgba(0,0,0,0.55),
0 26px 54px -34px rgba(0,0,0,0.95),
0 -18px 60px -40px var(--glow);
transition:transform .25s;
}

.podium-player:hover{
transform:translateY(-4px);
}

.podium-1{
--ink:rgb(122,83,4);
--hl:rgba(255,246,196,0.5);
--num:rgba(160,109,5,0.4);
--band:rgba(160,109,5,0.26);
--glow:rgba(255,206,0,0.4);
background:linear-gradient(148deg,rgb(255,246,196) 0%,rgb(255,206,0) 46%,rgb(196,146,3) 100%);
}

.podium-2{
--ink:rgb(96,105,128);
--hl:rgba(255,255,255,0.5);
--num:rgba(126,138,168,0.4);
--band:rgba(126,138,168,0.26);
--glow:rgba(207,214,230,0.34);
background:linear-gradient(148deg,rgb(255,255,255) 0%,rgb(207,214,230) 46%,rgb(157,167,192) 100%);
margin-top:34px;
}

.podium-3{
--ink:rgb(95,50,18);
--hl:rgba(246,189,133,0.5);
--num:rgba(125,66,24,0.4);
--band:rgba(125,66,24,0.26);
--glow:rgba(205,127,50,0.36);
background:linear-gradient(148deg,rgb(246,189,133) 0%,rgb(205,127,50) 46%,rgb(155,89,34) 100%);
margin-top:44px;
}

.podium-rank{
position:absolute;
top:6px;
left:14px;
font-size:56px;
font-weight:900;
line-height:1;
color:var(--num);
text-shadow:none;
}

.podium-1 .podium-rank{
font-size:64px;
}

.podium-name{
padding:30px 20px 0;
font-size:18px;
font-weight:800;
}

.podium-1 .podium-name{
padding-top:34px;
}

.podium-stats dt{
font-size:9.5px;
font-weight:800;
letter-spacing:1.5px;
}

.podium-stats dd{
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.podium-stats .gem{
width:18px;
}

.podium-wager{
padding:16px 20px 18px;
}

.podium-wager dt{
margin-bottom:2px;
}

.podium-wager dd{
font-size:20px;
}

.podium-1 .podium-wager dd{
font-size:22px;
}

.podium-prize{
padding:12px 20px 14px;
background:var(--band);
box-shadow:
inset 0 1px 0 var(--hl),
inset 0 9px 16px -11px rgba(0,0,0,0.5);
}

.podium-prize dd{
font-size:21px;
}

.podium-1 .podium-prize dd{
font-size:23px;
}

/* PROGRESO DEL RACE */

.race{
max-width:872px;
margin:62px auto 0;
}

.race-info{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:end;
gap:20px;
margin-bottom:30px;
}

.race-label{
display:block;
font-size:11px;
font-weight:800;
letter-spacing:0.7px;
color:#9789cd;
margin-bottom:4px;
}

.race-date{
font-size:13px;
font-weight:700;
}

.race-end{
text-align:right;
}

.race-day{
text-align:center;
}

.race-day strong{
display:block;
font-size:16.3px;
font-weight:900;
letter-spacing:-0.16px;
}

.race-status{
font-size:11px;
font-weight:700;
color:#6a40d9;
}

.race-bar{
position:relative;
height:8px;
border-radius:999px;
background:
repeating-linear-gradient(90deg,rgba(151,137,205,0.28) 0,rgba(151,137,205,0.28) 1px,transparent 1px,transparent 10%),
rgba(44,40,82,0.85);
box-shadow:inset 0 1px 2px rgba(0,0,0,0.45);
}

.race-fill{
height:100%;
border-radius:999px;
background:linear-gradient(90deg,#6a40d9,#9789cd);
}

.race-thumb{
position:absolute;
top:50%;
width:16px;
height:16px;
border-radius:50%;
background:#9789cd;
border:3px solid #52439b;
transform:translate(-50%,-50%);
}

.race-pct{
position:absolute;
bottom:24px;
transform:translateX(-50%);
padding:3px 9px;
border-radius:6px;
background:#52439b;
color:#f2eeff;
font-size:10.5px;
font-weight:900;
white-space:nowrap;
}

/* LEADERBOARD */

.board{
max-width:1180px;
margin:60px auto 0;
}

.board-head{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:20px;
padding:0 4px 18px;
}

.board-kicker{
font-size:12px;
font-weight:800;
color:#6a40d9;
margin-bottom:4px;
}

.board-title{
font-size:30px;
font-weight:700;
letter-spacing:-0.45px;
}

.board-updated{
text-align:right;
font-size:11px;
color:#9789cd;
}

.board-updated b{
display:block;
margin-top:2px;
font-size:11.5px;
font-weight:700;
color:white;
}

.board-cols,
.board-row{
display:grid;
grid-template-columns:72px 1fr 170px 110px;
align-items:center;
}

.board-cols{
padding:0 16px 10px;
font-size:10px;
font-weight:800;
letter-spacing:1px;
color:#d9d1f4;
}

.board-cols span:nth-child(3){
text-align:right;
padding-right:20px;
}

.board-cols span:nth-child(4){
text-align:right;
padding-right:22px;
}

.board-list{
list-style:none;
display:flex;
flex-direction:column;
gap:10px;
}

.board-row{
min-height:76px;
padding:14px 16px;
border-radius:12px;
background:linear-gradient(100deg,rgba(44,40,82,0.55),rgba(25,25,57,0.85) 55%);
border:1px solid rgba(151,137,205,0.16);
transition:border-color .2s;
}

.board-row:hover{
border-color:rgba(151,137,205,0.4);
}

.board-pos{
padding-left:20px;
font-size:24px;
font-weight:900;
letter-spacing:-0.96px;
background:linear-gradient(160deg,#d9d1f4 0%,#9789cd 100%);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.board-player{
display:flex;
align-items:center;
gap:14px;
min-width:0;
}

.board-icon{
width:34px;
flex-shrink:0;
}

.board-info{
flex:1;
min-width:0;
}

.board-name{
font-size:14.5px;
font-weight:700;
}

.board-gap{
display:flex;
align-items:center;
gap:12px;
margin-top:6px;
}

.board-gap-bar{
flex:1;
max-width:610px;
height:4px;
border-radius:999px;
background:rgba(44,40,82,0.85);
overflow:hidden;
}

.board-gap-fill{
height:100%;
background:#7b62d6;
}

.board-gap-text{
font-size:10px;
font-weight:700;
color:#9789cd;
white-space:nowrap;
}

.board-wager{
text-align:right;
padding-right:20px;
font-size:14.7px;
font-weight:800;
display:flex;
align-items:center;
justify-content:flex-end;
gap:6px;
}

.board-prize{
text-align:right;
}

.prize-pill{
display:inline-flex;
align-items:center;
gap:6px;
padding:9px 12px;
border-radius:8px;
background:rgba(106,64,217,0.09);
border:1px solid rgba(106,64,217,0.32);
color:#b09aef;
font-size:14px;
font-weight:900;
}

.gem{
width:16px;
}

/* HEADER: SIN LUGAR PARA CENTRAR EL MENÚ, LOGO Y MENÚ JUNTOS */

@media (max-width:1259px){

header{
display:flex;
justify-content:center;
gap:40px;
}

.logo{
margin-right:0;
}

}

/* HEADER: LOGO ARRIBA DEL MENÚ CUANDO NO ENTRAN EN UNA FILA */

@media (max-width:960px){

header{
display:flex;
flex-direction:column;
gap:14px;
padding:18px 16px;
}

.logo{
margin-right:0;
}

}

/* CELULAR */

@media (max-width:860px){

.podium{
grid-template-columns:1fr;
max-width:380px;
gap:20px;
margin-top:60px;
}

.podium-1{
order:-1;
}

.podium-2,
.podium-3{
margin-top:0;
}

}

@media (max-width:700px){

/* HEADER: SOLO ÍCONOS, MENOS CLASH */

header{
display:flex;
flex-direction:column;
gap:14px;
padding:18px 16px;
}

.nav-pill a{
padding:8px 10px;
}

.nav-pill a span{
display:none;
}

.nav-pill .nav-clash span{
display:inline;
}

.container{
padding:50px 16px 70px;
}

.hero h1{
font-size:64px;
letter-spacing:-1px;
}

.hero h1 span{
-webkit-text-stroke:1.5px #9789cd;
}

.stats{
margin-top:34px;
}

.stat dt{
font-size:9px;
}

.stat dd{
font-size:16px;
}

.stat dd .gem{
width:15px;
}

.actions{
margin-top:28px;
}

.btn{
height:44px;
padding:0 16px;
font-size:13px;
}

.race-info{
grid-template-columns:1fr 1fr;
gap:14px;
}

.race-day{
grid-column:1 / -1;
grid-row:1;
}

.race-date{
font-size:11px;
}

.board-head{
flex-direction:column;
align-items:flex-start;
}

.board-updated{
text-align:left;
}

.board-cols{
display:none;
}

.board-row{
grid-template-columns:48px 1fr auto;
grid-template-areas:
"pos player prize"
"pos wager prize";
row-gap:6px;
}

.board-pos{
grid-area:pos;
padding-left:0;
}

.board-player{
grid-area:player;
}

.board-icon{
display:none;
}

.board-wager{
grid-area:wager;
justify-content:flex-start;
padding-right:0;
font-size:13px;
}

.board-prize{
grid-area:prize;
padding-left:10px;
}

.board-gap{
flex-wrap:wrap;
gap:4px 10px;
}

.board-gap-bar{
flex-basis:100%;
}

}

</style>
</head>

<body>

<header>
<a href="index.html" class="logo">Alyax<span>Community</span></a>
<nav class="nav-pill">
<a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
<a href="index.html#sponsors"><i class="fa-regular fa-star"></i><span>Sponsors</span></a>
<a href="index.html#videos"><i class="fa-regular fa-circle-play"></i><span>Videos</span></a>
<a href="index.html#stream"><i class="fa-solid fa-tower-broadcast"></i><span>Stream</span></a>
<a href="leaderboards.html" class="nav-clash"><img src="gem.webp" alt=""><span>Clash</span></a>
</nav>
</header>

<main class="container">

<section class="hero">
<img src="gem.webp" class="hero-logo" alt="Clash.GG">
<h1>CLASH<span>RACE</span></h1>

<dl class="stats">
<div class="stat"><dt>POZO TOTAL</dt><dd id="stat-pool"></dd></div>
<div class="stat"><dt>DURACIÓN</dt><dd id="stat-days"></dd></div>
<div class="stat"><dt>PUESTOS PREMIADOS</dt><dd id="stat-top"></dd></div>
</dl>

<div class="actions">
<a id="play-link" class="btn btn-play" target="_blank">Jugar en Clash</a>
<button id="code-btn" class="btn btn-code" type="button">Código <b id="code-text"></b></button>
</div>
</section>

<section class="podium" id="podium"></section>

<section class="race">
<div class="race-info">
<div><span class="race-label">ARRANCÓ</span><span class="race-date" id="race-start"></span></div>
<div class="race-day"><strong id="race-day"></strong><span class="race-status" id="race-status"></span></div>
<div class="race-end"><span class="race-label">CIERRA</span><span class="race-date" id="race-end"></span></div>
</div>
<div class="race-bar">
<div class="race-fill" id="race-fill"></div>
<span class="race-thumb" id="race-thumb"></span>
<span class="race-pct" id="race-pct"></span>
</div>
</section>

<section class="board">
<div class="board-head">
<div>
<p class="board-kicker">RANKING OFICIAL</p>
<h2 class="board-title">Leaderboard</h2>
</div>
<div class="board-updated">Última actualización<b id="updated"></b></div>
</div>
<div class="board-cols"><span>POS.</span><span>JUGADOR</span><span>WAGER</span><span>PREMIO</span></div>
<ol class="board-list" id="ranking"></ol>
</section>

</main>

<script>

/* DATOS DEL LEADERBOARD — para actualizar el ranking, editar solo esto */

const LEADERBOARD={
prizePool:500,                         // gemas
periodDays:14,                         // quincenal
endsAt:"2026-11-01T23:59:00-03:00",    // FECHA DE EJEMPLO: cierre del período actual
updatedAt:"2026-10-23T12:00:00-03:00", // última vez que se actualizó el ranking
code:"ALYAX",                          // código de afiliado
referral:"https://clash.gg/r/ALYAX",   // link de "Jugar en Clash"
rewards:[250,125,75,25,25],            // premio en gemas por puesto (#1, #2, ...); debe sumar prizePool
players:[
{name:"LILGIO",wagered:12540},
{name:"Tiempos",wagered:10210},
{name:"PlayerX",wagered:8430},
{name:"GamerPro",wagered:6990},
{name:"BetMaster",wagered:5420},
{name:"CryptoKid",wagered:4200},
{name:"SpinMaster",wagered:3850}
]
};

/* RENDER */

const GEM='<img src="gem.webp" class="gem" alt="">';
const DAY=86400000;

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmt(n){
return Number(n).toLocaleString("en-US");
}

const DATE_FMT=new Intl.DateTimeFormat("es-AR",{
day:"2-digit",month:"short",year:"numeric",
hour:"2-digit",minute:"2-digit",hour12:true,
timeZone:"America/Argentina/Buenos_Aires"
});

function fmtDate(t){
return DATE_FMT.format(new Date(t))+" ART";
}

const ranked=[...LEADERBOARD.players].sort((a,b)=>b.wagered-a.wagered);
const reward=i=>LEADERBOARD.rewards[i]||0;

// hero
document.getElementById("stat-pool").innerHTML=`${GEM}${fmt(LEADERBOARD.prizePool)}`;
document.getElementById("stat-days").textContent=`${LEADERBOARD.periodDays} días`;
document.getElementById("stat-top").textContent=`Top ${LEADERBOARD.rewards.length}`;
document.getElementById("play-link").href=LEADERBOARD.referral;
document.getElementById("code-text").textContent=LEADERBOARD.code;

const codeBtn=document.getElementById("code-btn");
codeBtn.addEventListener("click",()=>{
navigator.clipboard?.writeText(LEADERBOARD.code).then(()=>{
codeBtn.innerHTML="¡Copiado!";
setTimeout(()=>{codeBtn.innerHTML=`Código <b>${esc(LEADERBOARD.code)}</b>`;},1500);
});
});

// podio: orden visual 2do, 1ro, 3ro
document.getElementById("podium").innerHTML=[1,0,2]
.filter(i=>ranked[i])
.map(i=>`
<article class="podium-player podium-${i+1}">
<span class="podium-rank">${i+1}</span>
<div class="podium-name">${esc(ranked[i].name)}</div>
<dl class="podium-stats">
<div class="podium-wager"><dt>WAGER</dt><dd>${GEM}${fmt(ranked[i].wagered)}</dd></div>
<div class="podium-prize"><dt>PREMIO</dt><dd>${GEM}${fmt(reward(i))}</dd></div>
</dl>
</article>`).join("");

// tabla desde el #4
document.getElementById("ranking").innerHTML=ranked.slice(3).map((p,j)=>{
const i=j+3;
const above=ranked[i-1];
const pct=Math.min(100,p.wagered/above.wagered*100);
return `
<li class="board-row">
<span class="board-pos">${String(i+1).padStart(2,"0")}</span>
<div class="board-player">
<img src="gem.webp" class="board-icon" alt="">
<div class="board-info">
<div class="board-name">${esc(p.name)}</div>
<div class="board-gap">
<div class="board-gap-bar"><div class="board-gap-fill" style="width:${pct}%"></div></div>
<span class="board-gap-text">${fmt(above.wagered-p.wagered)} para el #${i}</span>
</div>
</div>
</div>
<span class="board-wager">${GEM}${fmt(p.wagered)}</span>
<span class="board-prize">${reward(i)?`<span class="prize-pill">${GEM}${fmt(reward(i))}</span>`:""}</span>
</li>`;
}).join("");

document.getElementById("updated").textContent=fmtDate(LEADERBOARD.updatedAt);

/* PROGRESO DEL RACE — si la fecha de cierre ya pasó, salta al período siguiente */

function updateRace(){
const period=LEADERBOARD.periodDays*DAY;
let end=new Date(LEADERBOARD.endsAt).getTime();
const now=Date.now();
while(end<=now){end+=period;}
const start=end-period;

const pct=Math.min(100,Math.max(0,(now-start)/period*100));
const day=Math.min(LEADERBOARD.periodDays,Math.floor((now-start)/DAY)+1);

document.getElementById("race-start").textContent=fmtDate(start);
document.getElementById("race-end").textContent=fmtDate(end);
document.getElementById("race-day").textContent=`Día ${day} de ${LEADERBOARD.periodDays}`;
document.getElementById("race-status").textContent="En curso";
document.getElementById("race-fill").style.width=pct+"%";
document.getElementById("race-thumb").style.left=pct+"%";
document.getElementById("race-pct").style.left=pct+"%";
document.getElementById("race-pct").textContent=Math.floor(pct)+"%";
}

updateRace();
setInterval(updateRace,60000);

</script>

</body>
</html>
