<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Leaderboard</title>
  <link rel="icon" type="image/webp" href="gem.webp">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#0d0d0f;
color:white;
overflow-x:hidden;
}

/* PARTICULAS (MISMO FONDO QUE EL INICIO) */

#particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* HEADER */

header{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:22px 60px;
}

.logo{
justify-self:end;
margin-right:84px;
font-weight:800;
font-size:20px;
letter-spacing:-0.5px;
color:white;
text-decoration:none;
}

.logo span{
color:#f7a823;
}

.nav-pill{
display:flex;
align-items:center;
gap:4px;
padding:6px 10px;
border:1px solid rgba(247,168,35,0.18);
border-radius:18px;
background:rgba(10,10,12,0.6);
}

.nav-pill a{
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
border-radius:12px;
text-decoration:none;
color:#d4d4d8;
font-size:15px;
font-weight:700;
transition:.2s;
}

.nav-pill a i{
color:#f7a823;
font-size:14px;
}

.nav-pill a:hover{
color:white;
background:rgba(255,255,255,0.05);
}

.nav-pill .nav-clash{
color:#f7a823;
}

.nav-pill .nav-clash:hover{
color:#ffbd45;
}

.nav-pill .nav-clash img{
width:20px;
}

/* MAIN */

.container{
max-width:1180px;
margin:auto;
padding:70px 20px 100px;
}

/* HERO */

.hero{
position:relative;
text-align:center;
}

/* GEMAS FLOTANDO */

.float-gem{
position:absolute;
z-index:-1;
pointer-events:none;
filter:drop-shadow(0 10px 30px rgba(247,168,35,0.35));
animation:float 6s ease-in-out infinite;
}

.fg1{
--r:-18deg;
width:110px;
top:2%;
left:4%;
}

.fg2{
--r:22deg;
width:80px;
top:0;
right:8%;
animation-delay:-2s;
}

.fg3{
--r:12deg;
width:130px;
bottom:0;
left:7%;
opacity:0.45;
filter:blur(2px);
animation-delay:-4s;
}

.fg4{
--r:-10deg;
width:95px;
bottom:8%;
right:4%;
animation-delay:-1s;
}

@keyframes float{
0%,100%{transform:translateY(0) rotate(var(--r));}
50%{transform:translateY(-18px) rotate(var(--r));}
}

.hero h1{
font-size:120px;
font-weight:900;
line-height:0.9;
letter-spacing:-2px;
}

.hero h1 span{
display:block;
color:transparent;
-webkit-text-stroke:2px #f7a823;
}

/* STATS */

.stats{
display:flex;
justify-content:center;
margin:50px auto 0;
max-width:760px;
}

.stat{
flex:1;
padding:12px 4px;
}

.stat + .stat{
border-left:1px solid rgba(151,137,205,0.25);
}

.stat dt{
font-size:12px;
font-weight:700;
color:#9789cd;
margin-bottom:8px;
}

.stat dd{
font-size:24px;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.stat dd .gem{
width:20px;
}

/* BOTONES */

.actions{
display:flex;
justify-content:center;
gap:12px;
margin-top:38px;
}

.btn{
height:50px;
padding:0 20px;
border-radius:8px;
display:inline-flex;
align-items:center;
gap:10px;
font-family:inherit;
font-size:14.4px;
font-weight:800;
color:white;
text-decoration:none;
cursor:pointer;
transition:.2s;
}

.btn-play{
background:linear-gradient(180deg,#f7a823,#c67a00);
border:1px solid #f7a823;
color:#1a1206;
}

.btn-play:hover{
box-shadow:0 0 20px rgba(247,168,35,0.45);
}

.btn-code{
background:rgba(106,64,217,0.22);
border:1px solid rgba(151,137,205,0.45);
font-weight:400;
color:#9789cd;
}

.btn-code b{
color:white;
font-weight:800;
}

.btn-code:hover{
background:rgba(106,64,217,0.32);
}

/* PODIO */

.podium{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
align-items:start;
max-width:1180px;
margin:90px auto 0;
}

.podium-player{
position:relative;
border-radius:14px;
overflow:hidden;
text-align:center;
color:var(--ink);
text-shadow:0 1px 0 var(--hl);
box-shadow:
inset 0 1px 0 rgba(255,255,255,0.6),
inset 0 -22px 32px -24px rgba(0,0,0,0.55),
0 26px 54px -34px rgba(0,0,0,0.95),
0 -18px 60px -40px var(--glow);
transition:transform .25s;
}

.podium-player:hover{
transform:translateY(-4px);
}

.podium-1{
--ink:rgb(122,83,4);
--hl:rgba(255,246,196,0.5);
--num:rgba(160,109,5,0.4);
--band:rgba(160,109,5,0.26);
--glow:rgba(255,206,0,0.4);
background:linear-gradient(148deg,rgb(255,246,196) 0%,rgb(255,206,0) 46%,rgb(196,146,3) 100%);
}

.podium-2{
--ink:rgb(96,105,128);
--hl:rgba(255,255,255,0.5);
--num:rgba(126,138,168,0.4);
--band:rgba(126,138,168,0.26);
--glow:rgba(207,214,230,0.34);
background:linear-gradient(148deg,rgb(255,255,255) 0%,rgb(207,214,230) 46%,rgb(157,167,192) 100%);
margin-top:34px;
}

.podium-3{
--ink:rgb(95,50,18);
--hl:rgba(246,189,133,0.5);
--num:rgba(125,66,24,0.4);
--band:rgba(125,66,24,0.26);
--glow:rgba(205,127,50,0.36);
background:linear-gradient(148deg,rgb(246,189,133) 0%,rgb(205,127,50) 46%,rgb(155,89,34) 100%);
margin-top:44px;
}

.podium-rank{
position:absolute;
top:6px;
left:14px;
font-size:56px;
font-weight:900;
line-height:1;
color:var(--num);
text-shadow:none;
}

.podium-1 .podium-rank{
font-size:64px;
}

.podium-name{
padding:30px 20px 0;
font-size:18px;
font-weight:800;
}

.podium-1 .podium-name{
padding-top:34px;
}

.podium-stats dt{
font-size:9.5px;
font-weight:800;
letter-spacing:1.5px;
}

.podium-stats dd{
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.podium-stats .gem{
width:18px;
}

.podium-wager{
padding:16px 20px 18px;
}

.podium-wager dt{
margin-bottom:2px;
}

.podium-wager dd{
font-size:20px;
}

.podium-1 .podium-wager dd{
font-size:22px;
}

.podium-prize{
padding:12px 20px 14px;
background:var(--band);
box-shadow:
inset 0 1px 0 var(--hl),
inset 0 9px 16px -11px rgba(0,0,0,0.5);
}

.podium-prize dd{
font-size:21px;
}

.podium-1 .podium-prize dd{
font-size:23px;
}

/* CUENTA REGRESIVA */

.countdown{
max-width:1020px;
margin:62px auto 0;
padding:28px 40px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px;
border-radius:12px;
background:#1b1b1b;
border:1px solid rgba(247,168,35,0.35);
box-shadow:0 0 30px rgba(247,168,35,0.12),0 10px 30px rgba(0,0,0,0.5);
}

.countdown-title{
font-size:30px;
font-weight:800;
font-style:italic;
letter-spacing:0.5px;
}

.countdown-sub{
margin-top:4px;
font-size:14px;
color:#e0a030;
}

.countdown-units{
display:flex;
gap:24px;
}

.cd-unit{
text-align:center;
}

.cd-box{
width:80px;
height:58px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:linear-gradient(180deg,#e3a32f,#d38f1c);
box-shadow:inset 0 -6px 0 rgba(0,0,0,0.18);
color:#1b1b1b;
font-size:28px;
font-weight:900;
}

.cd-label{
display:block;
margin-top:10px;
font-size:12px;
font-weight:800;
letter-spacing:1px;
color:#b5b5b5;
}

/* LEADERBOARD */

.board{
max-width:1180px;
margin:60px auto 0;
}

.board-head{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:20px;
padding:0 4px 18px;
}

.board-kicker{
font-size:12px;
font-weight:800;
color:#6a40d9;
margin-bottom:4px;
}

.board-title{
font-size:30px;
font-weight:700;
letter-spacing:-0.45px;
}

.board-updated{
text-align:right;
font-size:11px;
color:#9789cd;
}

.board-updated b{
display:block;
margin-top:2px;
font-size:11.5px;
font-weight:700;
color:white;
}

.board-cols,
.board-row{
display:grid;
grid-template-columns:72px 1fr 170px 110px;
align-items:center;
}

.board-cols{
padding:0 16px 10px;
font-size:10px;
font-weight:800;
letter-spacing:1px;
color:#d9d1f4;
}

.board-cols span:nth-child(3){
text-align:right;
padding-right:20px;
}

.board-cols span:nth-child(4){
text-align:right;
padding-right:22px;
}

.board-list{
list-style:none;
display:flex;
flex-direction:column;
gap:10px;
}

.board-row{
min-height:76px;
padding:14px 16px;
border-radius:12px;
background:linear-gradient(100deg,rgba(44,40,82,0.55),rgba(25,25,57,0.85) 55%);
border:1px solid rgba(151,137,205,0.16);
transition:border-color .2s;
}

.board-row:hover{
border-color:rgba(151,137,205,0.4);
}

.board-pos{
padding-left:20px;
font-size:24px;
font-weight:900;
letter-spacing:-0.96px;
background:linear-gradient(160deg,#d9d1f4 0%,#9789cd 100%);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.board-player{
display:flex;
align-items:center;
gap:14px;
min-width:0;
}

.board-icon{
width:34px;
flex-shrink:0;
}

.board-info{
flex:1;
min-width:0;
}

.board-name{
font-size:14.5px;
font-weight:700;
}

.board-gap{
display:flex;
align-items:center;
gap:12px;
margin-top:6px;
}

.board-gap-bar{
flex:1;
max-width:610px;
height:4px;
border-radius:999px;
background:rgba(44,40,82,0.85);
overflow:hidden;
}

.board-gap-fill{
height:100%;
background:#7b62d6;
}

.board-gap-text{
font-size:10px;
font-weight:700;
color:#9789cd;
white-space:nowrap;
}

.board-wager{
text-align:right;
padding-right:20px;
font-size:14.7px;
font-weight:800;
display:flex;
align-items:center;
justify-content:flex-end;
gap:6px;
}

.board-prize{
text-align:right;
}

.prize-pill{
display:inline-flex;
align-items:center;
gap:6px;
padding:9px 12px;
border-radius:8px;
background:rgba(106,64,217,0.09);
border:1px solid rgba(106,64,217,0.32);
color:#b09aef;
font-size:14px;
font-weight:900;
}

.gem{
width:16px;
}

/* HEADER: SIN LUGAR PARA CENTRAR EL MENÚ, LOGO Y MENÚ JUNTOS */

@media (max-width:1259px){

header{
display:flex;
justify-content:center;
gap:40px;
}

.logo{
margin-right:0;
}

}

/* HEADER: LOGO ARRIBA DEL MENÚ CUANDO NO ENTRAN EN UNA FILA */

@media (max-width:960px){

header{
display:flex;
flex-direction:column;
gap:14px;
padding:18px 16px;
}

.logo{
margin-right:0;
}

}

/* CELULAR */

@media (max-width:900px){

.float-gem{
display:none;
}

}

@media (max-width:860px){

.podium{
grid-template-columns:1fr;
max-width:380px;
gap:20px;
margin-top:60px;
}

.podium-1{
order:-1;
}

.podium-2,
.podium-3{
margin-top:0;
}

}

@media (max-width:700px){

/* HEADER: SOLO ÍCONOS, MENOS CLASH */

header{
display:flex;
flex-direction:column;
gap:14px;
padding:18px 16px;
}

.nav-pill a{
padding:8px 10px;
}

.nav-pill a span{
display:none;
}

.nav-pill .nav-clash span{
display:inline;
}

.container{
padding:50px 16px 70px;
}

.hero h1{
font-size:64px;
letter-spacing:-1px;
}

.hero h1 span{
-webkit-text-stroke:1.5px #f7a823;
}

.stats{
margin-top:34px;
}

.stat dt{
font-size:9px;
}

.stat dd{
font-size:16px;
}

.stat dd .gem{
width:15px;
}

.actions{
margin-top:28px;
}

.btn{
height:44px;
padding:0 16px;
font-size:13px;
}

.countdown{
flex-direction:column;
text-align:center;
padding:24px 16px;
gap:22px;
}

.countdown-title{
font-size:22px;
}

.countdown-units{
gap:12px;
}

.cd-box{
width:64px;
height:50px;
font-size:24px;
}

.cd-label{
font-size:11px;
}

.board-head{
flex-direction:column;
align-items:flex-start;
}

.board-updated{
text-align:left;
}

.board-cols{
display:none;
}

.board-row{
grid-template-columns:48px 1fr auto;
grid-template-areas:
"pos player prize"
"pos wager prize";
row-gap:6px;
}

.board-pos{
grid-area:pos;
padding-left:0;
}

.board-player{
grid-area:player;
}

.board-icon{
display:none;
}

.board-wager{
grid-area:wager;
justify-content:flex-start;
padding-right:0;
font-size:13px;
}

.board-prize{
grid-area:prize;
padding-left:10px;
}

.board-gap{
flex-wrap:wrap;
gap:4px 10px;
}

.board-gap-bar{
flex-basis:100%;
}

}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
<a href="index.html" class="logo">Alyax<span>Community</span></a>
<nav class="nav-pill">
<a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
<a href="index.html#sponsors"><i class="fa-regular fa-star"></i><span>Sponsors</span></a>
<a href="index.html#videos"><i class="fa-regular fa-circle-play"></i><span>Videos</span></a>
<a href="index.html#stream"><i class="fa-solid fa-tower-broadcast"></i><span>Stream</span></a>
<a href="leaderboards.html" class="nav-clash"><img src="gem.webp" alt=""><span>Clash</span></a>
</nav>
</header>

<main class="container">

<section class="hero">
<img src="gem.webp" class="float-gem fg1" alt="" aria-hidden="true">
<img src="gem.webp" class="float-gem fg2" alt="" aria-hidden="true">
<img src="gem.webp" class="float-gem fg3" alt="" aria-hidden="true">
<img src="gem.webp" class="float-gem fg4" alt="" aria-hidden="true">

<h1>CLASH<span>RACE</span></h1>

<dl class="stats">
<div class="stat"><dt>POZO TOTAL</dt><dd id="stat-pool"></dd></div>
<div class="stat"><dt>DURACIÓN</dt><dd id="stat-days"></dd></div>
<div class="stat"><dt>PUESTOS PREMIADOS</dt><dd id="stat-top"></dd></div>
</dl>

<div class="actions">
<a id="play-link" class="btn btn-play" target="_blank">Jugar en Clash</a>
<button id="code-btn" class="btn btn-code" type="button">Código <b id="code-text"></b></button>
</div>
</section>

<section class="podium" id="podium"></section>

<section class="countdown">
<div>
<h2 class="countdown-title">LEADERBOARD ENDS IN</h2>
<p class="countdown-sub">Make sure to secure your position!</p>
</div>
<div class="countdown-units">
<div class="cd-unit"><span class="cd-box" id="cd-days">00</span><span class="cd-label">DAYS</span></div>
<div class="cd-unit"><span class="cd-box" id="cd-hrs">00</span><span class="cd-label">HRS</span></div>
<div class="cd-unit"><span class="cd-box" id="cd-mins">00</span><span class="cd-label">MINS</span></div>
<div class="cd-unit"><span class="cd-box" id="cd-secs">00</span><span class="cd-label">SECS</span></div>
</div>
</section>

<section class="board">
<div class="board-head">
<div>
<p class="board-kicker">RANKING OFICIAL</p>
<h2 class="board-title">Leaderboard</h2>
</div>
<div class="board-updated">Última actualización<b id="updated"></b></div>
</div>
<div class="board-cols"><span>POS.</span><span>JUGADOR</span><span>WAGER</span><span>PREMIO</span></div>
<ol class="board-list" id="ranking"></ol>
</section>

</main>

<script>

/* DATOS DEL LEADERBOARD — para actualizar el ranking, editar solo esto */

const LEADERBOARD={
prizePool:500,                         // gemas
periodDays:14,                         // quincenal
endsAt:"2026-11-01T23:59:00-03:00",    // FECHA DE EJEMPLO: cierre del período actual
updatedAt:"2026-10-23T12:00:00-03:00", // última vez que se actualizó el ranking
code:"ALYAX",                          // código de afiliado
referral:"https://clash.gg/r/ALYAX",   // link de "Jugar en Clash"
rewards:[250,125,75,25,25],            // premio en gemas por puesto (#1, #2, ...); debe sumar prizePool
players:[
{name:"LILGIO",wagered:12540},
{name:"Tiempos",wagered:10210},
{name:"PlayerX",wagered:8430},
{name:"GamerPro",wagered:6990},
{name:"BetMaster",wagered:5420},
{name:"CryptoKid",wagered:4200},
{name:"SpinMaster",wagered:3850}
]
};

/* RENDER */

const GEM='<img src="gem.webp" class="gem" alt="">';
const DAY=86400000;

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmt(n){
return Number(n).toLocaleString("en-US");
}

const DATE_FMT=new Intl.DateTimeFormat("es-AR",{
day:"2-digit",month:"short",year:"numeric",
hour:"2-digit",minute:"2-digit",hour12:true,
timeZone:"America/Argentina/Buenos_Aires"
});

function fmtDate(t){
return DATE_FMT.format(new Date(t))+" ART";
}

const ranked=[...LEADERBOARD.players].sort((a,b)=>b.wagered-a.wagered);
const reward=i=>LEADERBOARD.rewards[i]||0;

// hero
document.getElementById("stat-pool").innerHTML=`${GEM}${fmt(LEADERBOARD.prizePool)}`;
document.getElementById("stat-days").textContent=`${LEADERBOARD.periodDays} días`;
document.getElementById("stat-top").textContent=`Top ${LEADERBOARD.rewards.length}`;
document.getElementById("play-link").href=LEADERBOARD.referral;
document.getElementById("code-text").textContent=LEADERBOARD.code;

const codeBtn=document.getElementById("code-btn");
codeBtn.addEventListener("click",()=>{
navigator.clipboard?.writeText(LEADERBOARD.code).then(()=>{
codeBtn.innerHTML="¡Copiado!";
setTimeout(()=>{codeBtn.innerHTML=`Código <b>${esc(LEADERBOARD.code)}</b>`;},1500);
});
});

// podio: orden visual 2do, 1ro, 3ro
document.getElementById("podium").innerHTML=[1,0,2]
.filter(i=>ranked[i])
.map(i=>`
<article class="podium-player podium-${i+1}">
<span class="podium-rank">${i+1}</span>
<div class="podium-name">${esc(ranked[i].name)}</div>
<dl class="podium-stats">
<div class="podium-wager"><dt>WAGER</dt><dd>${GEM}${fmt(ranked[i].wagered)}</dd></div>
<div class="podium-prize"><dt>PREMIO</dt><dd>${GEM}${fmt(reward(i))}</dd></div>
</dl>
</article>`).join("");

// tabla desde el #4
document.getElementById("ranking").innerHTML=ranked.slice(3).map((p,j)=>{
const i=j+3;
const above=ranked[i-1];
const pct=Math.min(100,p.wagered/above.wagered*100);
return `
<li class="board-row">
<span class="board-pos">${String(i+1).padStart(2,"0")}</span>
<div class="board-player">
<img src="gem.webp" class="board-icon" alt="">
<div class="board-info">
<div class="board-name">${esc(p.name)}</div>
<div class="board-gap">
<div class="board-gap-bar"><div class="board-gap-fill" style="width:${pct}%"></div></div>
<span class="board-gap-text">${fmt(above.wagered-p.wagered)} para el #${i}</span>

</div>
</div>

<span class="board-prize">${reward(i)?`<span class="prize-pill">${GEM}${fmt(reward(i))}</span>`:""}</span>

}).join("");

document.getElementById("updated").textContent=fmtDate(LEADERBOARD.updatedAt);

/* CUENTA REGRESIVA — si la fecha de cierre ya pasó, salta al período siguiente */

function updateCountdown(){
const period=LEADERBOARD.periodDays*DAY;
let end=new Date(LEADERBOARD.endsAt).getTime();
const now=Date.now();
while(end<=now){end+=period;}

const secs=Math.floor((end-now)/1000);
const pad=n=>String(n).padStart(2,"0");

document.getElementById("cd-days").textContent=pad(Math.floor(secs/86400));
document.getElementById("cd-hrs").textContent=pad(Math.floor(secs%86400/3600));
document.getElementById("cd-mins").textContent=pad(Math.floor(secs%3600/60));
document.getElementById("cd-secs").textContent=pad(secs%60);
}

updateCountdown();
setInterval(updateCountdown,1000);

/* PARTICULAS */

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2,
speedY:Math.random()*0.5+0.2
});
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="rgba(255,255,255,0.25)";

particles.forEach(p=>{

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();

p.y+=p.speedY;

if(p.y>canvas.height){
p.y=0;
p.x=Math.random()*canvas.width;
}

});

requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
});

</script>
